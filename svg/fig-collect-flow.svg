<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.5 L9 5 L0 9.5z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="640" height="480" fill="#FAFAFA"/>

  <text x="320" y="28" text-anchor="middle" fill="#444441" font-size="15" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">collect_all() 执行流程</text>

  <!-- Entry -->
  <rect x="210" y="44" width="220" height="32" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="320" y="65" text-anchor="middle" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">collect_all()</text>
  <line x1="320" y1="76" x2="320" y2="94" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Steps -->
  <g font-family="Microsoft YaHei,PingFang SC,sans-serif">
    <rect x="50" y="96" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="116" fill="#444441" font-size="12">[1]</text>
    <text x="95" y="116" fill="#444441" font-size="12">_collect_host_info()</text>
    <text x="340" y="116" fill="#888780" font-size="11">→ 主机名 / OS / 内核 / IP / 运行时长</text>

    <rect x="50" y="132" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="152" fill="#444441" font-size="12">[2]</text>
    <text x="95" y="152" fill="#444441" font-size="12">_collect_accounts()</text>
    <text x="340" y="152" fill="#888780" font-size="11">→ 用户账户 / UID / 权限配置</text>

    <rect x="50" y="168" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="188" fill="#444441" font-size="12">[3]</text>
    <text x="95" y="188" fill="#444441" font-size="12">_collect_processes()</text>
    <text x="340" y="188" fill="#888780" font-size="11">→ 进程列表 / CPU / 可疑进程</text>

    <rect x="50" y="204" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="224" fill="#444441" font-size="12">[4]</text>
    <text x="95" y="224" fill="#444441" font-size="12">_collect_network()</text>
    <text x="340" y="224" fill="#888780" font-size="11">→ 网络连接 / 监听端口 / 可疑端口</text>

    <rect x="50" y="240" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="260" fill="#444441" font-size="12">[5]</text>
    <text x="95" y="260" fill="#444441" font-size="12">_collect_cron_jobs()</text>
    <text x="340" y="260" fill="#888780" font-size="11">→ 计划任务 (Linux cron / Win Task)</text>

    <rect x="50" y="276" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="296" fill="#444441" font-size="12">[6]</text>
    <text x="95" y="296" fill="#444441" font-size="12">_collect_logs()</text>
    <text x="340" y="296" fill="#888780" font-size="11">→ 系统日志 / 安全日志 / 事件日志</text>

    <rect x="50" y="312" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="332" fill="#444441" font-size="12">[7]</text>
    <text x="95" y="332" fill="#444441" font-size="12">_collect_file_indicators()</text>
    <text x="340" y="332" fill="#888780" font-size="11">→ /tmp可执行 / 隐藏文件 / ADS</text>

    <rect x="50" y="348" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="368" fill="#444441" font-size="12">[8]</text>
    <text x="95" y="368" fill="#444441" font-size="12">_collect_windows_specific()</text>
    <text x="340" y="368" fill="#888780" font-size="11">→ 仅Windows: RDP / UAC / SMB / WMI</text>

    <rect x="50" y="384" width="540" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
    <text x="65" y="404" fill="#444441" font-size="12">[9]</text>
    <text x="95" y="404" fill="#444441" font-size="12">_generate_summary(elapsed)</text>
    <text x="340" y="404" fill="#888780" font-size="11">→ 统计摘要</text>
  </g>

  <!-- Output -->
  <line x1="320" y1="420" x2="320" y2="440" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="180" y="440" width="280" height="30" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="320" y="460" text-anchor="middle" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">返回完整 evidence JSON 字典</text>
</svg>
