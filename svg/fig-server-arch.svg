<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 520" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.5 L9 5 L0 9.5z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="680" height="520" fill="#FAFAFA"/>

  <text x="340" y="28" text-anchor="middle" fill="#444441" font-size="15" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">服务端分析引擎架构</text>

  <!-- AnalysisServer -->
  <rect x="180" y="48" width="320" height="44" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="340" y="66" text-anchor="middle" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">AnalysisServer (app.py)</text>
  <text x="340" y="84" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">aiohttp HTTP API · 异步任务队列 · 进度追踪</text>

  <line x1="340" y1="92" x2="340" y2="112" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="352" y="106" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">POST /api/v1/evidence</text>

  <!-- EvidenceAnalyzer -->
  <rect x="100" y="116" width="340" height="280" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="138" text-anchor="middle" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">EvidenceAnalyzer (analyzer.py)</text>
  <line x1="115" y1="146" x2="425" y2="146" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Rule detector -->
  <rect x="130" y="158" width="280" height="42" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="178" text-anchor="middle" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">本地规则检测器</text>
  <text x="270" y="194" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">7类检测方法 (规则匹配 + 正则)</text>
  <line x1="270" y1="200" x2="270" y2="216" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Attack chain -->
  <rect x="130" y="218" width="280" height="38" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="238" text-anchor="middle" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">攻击链还原器</text>
  <text x="270" y="252" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">ATT&CK映射 · 时间线排序</text>
  <line x1="270" y1="256" x2="270" y2="272" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Attacker profile -->
  <rect x="130" y="274" width="280" height="38" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="294" text-anchor="middle" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">攻击者画像模块</text>
  <text x="270" y="308" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">IP聚合 · 手法特征 · 技能评级</text>
  <line x1="270" y1="312" x2="270" y2="328" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- LLM Analyzer -->
  <rect x="130" y="330" width="280" height="38" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="350" text-anchor="middle" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">LLM深度分析器</text>
  <text x="270" y="364" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">5次顺序调用 (威胁/进程/任务/登录/链)</text>

  <!-- LLMClient -->
  <line x1="410" y1="349" x2="480" y2="349" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="484" y="330" width="160" height="38" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="564" y="350" text-anchor="middle" fill="#444441" font-size="12" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">LLMClient</text>
  <text x="564" y="364" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">(llm_client.py)</text>

  <!-- Arrow to report builder -->
  <line x1="270" y1="396" x2="270" y2="424" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="282" y="416" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">analysis_result</text>

  <!-- ReportBuilder -->
  <rect x="130" y="428" width="280" height="44" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="270" y="448" text-anchor="middle" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">ServerReportBuilder</text>
  <text x="270" y="466" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">(report_builder.py) · 10个章节模板组装</text>
</svg>
