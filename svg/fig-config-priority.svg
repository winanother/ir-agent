<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.5 L9 5 L0 9.5z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="500" height="380" fill="#FAFAFA"/>

  <text x="250" y="28" text-anchor="middle" fill="#444441" font-size="15" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">配置加载优先级</text>

  <!-- Priority 1 -->
  <rect x="90" y="50" width="320" height="40" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="110" y="70" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">[1]</text>
  <text x="145" y="70" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">用户指定路径 (-c 参数)</text>
  <text x="145" y="86" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">最高优先级</text>

  <line x1="250" y1="90" x2="250" y2="112" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="106" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">失败</text>

  <!-- Priority 2 -->
  <rect x="90" y="114" width="320" height="40" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="110" y="134" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">[2]</text>
  <text x="145" y="134" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">~/.emergency_response_agent/config.json</text>
  <text x="145" y="150" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">用户目录配置</text>

  <line x1="250" y1="154" x2="250" y2="176" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="170" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">失败</text>

  <!-- Priority 3 -->
  <rect x="90" y="178" width="320" height="40" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="110" y="198" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">[3]</text>
  <text x="145" y="198" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">项目根目录 config.json</text>
  <text x="145" y="214" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">项目级配置</text>

  <line x1="250" y1="218" x2="250" y2="240" stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="262" y="234" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">失败</text>

  <!-- Priority 4 -->
  <rect x="90" y="242" width="320" height="40" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="110" y="262" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">[4]</text>
  <text x="145" y="262" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">环境变量</text>
  <text x="145" y="278" fill="#888780" font-size="10" font-family="Microsoft YaHei,PingFang SC,sans-serif">LLM_PROTOCOL / LLM_API_KEY / LLM_MODEL / ...</text>

  <!-- Note -->
  <rect x="60" y="310" width="380" height="44" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="250" y="330" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">低优先级来源仅在高优先级未找到时使用</text>
  <text x="250" y="348" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">Ollama协议无需API Key，始终可用</text>
</svg>
