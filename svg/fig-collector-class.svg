<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" width="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0.5 L9 5 L0 9.5z" fill="#888780"/>
    </marker>
  </defs>
  <rect width="660" height="340" fill="#FAFAFA"/>

  <text x="330" y="28" text-anchor="middle" fill="#444441" font-size="15" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">ForensicCollector 类结构</text>

  <!-- Class header -->
  <rect x="80" y="44" width="500" height="36" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="330" y="58" text-anchor="middle" fill="#444441" font-size="13" font-weight="bold" font-family="Microsoft YaHei,PingFang SC,sans-serif">ForensicCollector</text>
  <text x="330" y="74" text-anchor="middle" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">VERSION = "2.0.0"  ·  __init__(log_lines=500, verbose=False)</text>

  <line x1="80" y1="80" x2="580" y2="80" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Public methods -->
  <rect x="80" y="80" width="500" height="72" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="100" y="100" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">+ collect_all() → Dict</text>
  <text x="380" y="100" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">← 主采集入口</text>
  <text x="100" y="118" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">+ save_to_file(output_path) → str</text>
  <text x="380" y="118" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">← 本地保存</text>
  <text x="100" y="136" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">+ upload_to_server(server_url) → Dict</text>
  <text x="380" y="136" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">← 远程上传</text>

  <line x1="80" y1="152" x2="580" y2="152" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Private collectors -->
  <rect x="80" y="152" width="500" height="100" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="100" y="172" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _collect_host_info()  /  _collect_accounts()  /  _collect_processes()</text>
  <text x="100" y="190" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _collect_network()  /  _collect_cron_jobs()  /  _collect_logs()</text>
  <text x="100" y="208" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _collect_file_indicators()</text>
  <text x="100" y="232" fill="#888780" font-size="11" font-family="Microsoft YaHei,PingFang SC,sans-serif">每个方法根据 self.is_windows 分发到 _collect_xxx_linux() / _collect_xxx_windows()</text>

  <line x1="80" y1="252" x2="580" y2="252" stroke="#B4B2A9" stroke-width="0.5"/>

  <!-- Utility methods -->
  <rect x="80" y="252" width="500" height="72" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1"/>
  <text x="100" y="272" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _cmd(command, timeout=15)  ← 执行Shell命令</text>
  <text x="100" y="290" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _ps(script, timeout=20)  ← 执行PowerShell命令</text>
  <text x="100" y="308" fill="#444441" font-size="12" font-family="Microsoft YaHei,PingFang SC,sans-serif">- _decode_output(raw)  ·  _get_ip_addresses()  ·  _generate_summary(elapsed)</text>
</svg>
